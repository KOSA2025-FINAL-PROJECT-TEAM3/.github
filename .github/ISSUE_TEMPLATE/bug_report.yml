name: "🐛 Bug Report"
description: "버그를 발견하셨나요? 알려주세요!"
title: "[BUG] "
labels: ["bug", "needs-triage"]

body:
  - type: textarea
    id: description
    attributes:
      label: "버그 설명"
      description: "어떤 버그가 발생했는지 명확하고 간결하게 설명해주세요."
      placeholder: "예: 로그인 후 프로필 이미지가 깨져 보입니다."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "재현 방법"
      description: "버그를 재현하는 단계를 작성해주세요."
      placeholder: |
        1. '로그인' 버튼 클릭
        2. 사용자 정보 입력
        3. '로그인' 성공 후 프로필 페이지로 이동
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "예상 동작"
      description: "원래 어떻게 동작해야 한다고 생각하셨나요?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "실제 동작"
      description: "실제로는 어떻게 동작했나요?"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "심각도"
      options:
        - "🚨 Critical - 시스템 사용 불가"
        - "🔥 High - 주요 기능 작동 불가"
        - "⚠️ Medium - 일부 기능 작동 불가"
        - "✨ Low - 사소한 문제"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "버전 정보"
      description: "사용 중인 버전 정보를 알려주세요 (브랜치명, 커밋 해시 등)"
      placeholder: "예: main 브랜치, commit abc123"