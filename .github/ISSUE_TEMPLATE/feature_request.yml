name: "✨ 기능 요청"
description: "새로운 기능이나 개선 사항을 제안해주세요!"
title: "[FEATURE] "
labels: ["enhancement", "needs-discussion"]

body:
  - type: textarea
    id: problem
    attributes:
      label: "문제 상황"
      description: "어떤 문제를 해결하기 위한 기능인가요?"
      placeholder: "예: 부모님이 여러 약을 복용하시는데, 어떤 약이 복용 시간인지 잊으십니다."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "제안하는 해결책"
      description: "어떤 방식으로 해결하면 좋을까요?"
      placeholder: "예: 약 복용 시간을 알림으로 알려주는 기능을 추가했으면 좋겠습니다."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "우선순위"
      options:
        - "🚨 Critical - MVP에 꼭 필요함"
        - "🔥 High - 빠르게 추가하면 좋음"
        - "⚠️ Medium - 있으면 좋음"
        - "✨ Low - 나중에 추가해도 됨"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "완료 조건 (Acceptance Criteria)"
      description: "이 기능이 완성되려면 어떤 조건들이 만족되어야 할까요?"
      placeholder: |
        예:
        - [ ] 설정한 시간에 알림이 정확히 울려야 합니다.
        - [ ] 알림 클릭 시 앱으로 이동해야 합니다.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "체크리스트"
      description: "제출 전 확인해주세요!"
      options:
        - label: "이미 제안된 기능인지 검색해봤습니다."
          required: true
        - label: "프로젝트의 목표와 방향성에 맞는 기능입니다."
          required: true