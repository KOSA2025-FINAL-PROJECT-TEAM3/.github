name: "📖 문서 개선"
description: "문서 오류나 개선 사항을 제안해주세요."
title: "[DOCS] "
labels: ["documentation"]

body:
  - type: dropdown
    id: type
    attributes:
      label: "문서 유형"
      description: "어떤 종류의 문서 개선인가요?"
      options:
        - "README 수정"
        - "API 문서"
        - "아키텍처 문서"
        - "설치/실행 가이드"
        - "사용자 가이드"
        - "기타"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: "문서 위치"
      description: "개선이 필요한 문서의 경로를 입력해주세요."
      placeholder: "예: README.md, docs/API.md"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: "현재 내용"
      description: "문제가 있는 현재 내용을 복사해주세요 (선택 사항)."
      render: markdown

  - type: textarea
    id: proposed
    attributes:
      label: "제안하는 내용"
      description: "어떻게 수정하면 좋을까요?"
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: "긴급도"
      options:
        - "🚨 High - 중요 오류/결함"
        - "⚠️ Medium - 개선이 필요"
        - "✨ Low - 사소한 개선"
    validations:
      required: true