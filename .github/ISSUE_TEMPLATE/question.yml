name: "❓ 질문 / 아이디어 요청"
description: "궁금한 점이 있으시면 언제든지 물어보세요! 저희 팀이 도와드리겠습니다."
title: "[QUESTION] "
labels: ["question"]

body:
  - type: dropdown
    id: category
    attributes:
      label: "질문 카테고리"
      description: "어떤 분야에 대한 질문인가요?"
      options:
        - "설치 및 실행"
        - "개발 환경 설정"
        - "코드 작성 방법"
        - "아키텍처 및 시스템"
        - "디버깅 및 문제 해결"
        - "인증 및 보안"
        - "데이터베이스"
        - "API 사용법"
        - "기타"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: "질문 내용"
      description: "무엇이 궁금하신가요? 구체적으로 작성해주세요."
      placeholder: |
        예:
        - Spring Cloud Gateway에서 JWT 토큰을 검증하는 방법이 궁금합니다.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: "시도해본 방법"
      description: "이미 시도해본 것들이 있나요?"
    
  - type: dropdown
    id: urgency
    attributes:
      label: "긴급도"
      options:
        - "🚨 Urgent - 작업이 막혀있음"
        - "⚠️ Normal - 여유 있게 답변 기다림"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "체크리스트"
      description: "질문하기 전에 확인해주세요!"
      options:
        - label: "프로젝트 문서를 먼저 확인했습니다."
          required: true
        - label: "이미 올라온 질문인지 검색해봤습니다."
          required: true